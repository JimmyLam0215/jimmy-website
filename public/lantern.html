<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>前端互動離線燈籠</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050000; /* 極深色背景，襯托燈光 */
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 點擊啟動的提示畫面 */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff9900;
            cursor: pointer;
            z-index: 10;
            transition: opacity 0.5s ease;
            text-align: center;
            padding: 20px;
        }
        #overlay h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #ff3300;
        }
        #overlay p {
            font-size: 1.1rem;
            color: #ffcc66;
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="initLantern()">
        <h1>🏮 點擊啟動科技燈籠 🏮</h1>
        <p>（啟動後請允許麥克風權限，並對著手機說話或拍手）</p>
    </div>

    <canvas id="lanternCanvas"></canvas>

    <script>
        const canvas = document.getElementById('lanternCanvas');
        const ctx = canvas.getContext('2d');
        let audioContext, analyser, dataArray;
        let isInitialized = false;
        let particles = [];
        let baseHue = 15; // 初始色調：溫暖的橘紅色

        // 滿版自我適應螢幕大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 粒子類別定義
        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                // 隨機向四周擴散的速度
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2 + 0.5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.radius = Math.random() * 6 + 2;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.005;
                this.hue = baseHue + Math.random() * 30 - 15; // 圍繞主色調稍微偏色
            }
            update(vol) {
                // 受到聲音（音量）影響，音量越大，粒子擴散越快、膨脹越大
                this.x += this.vx * (1 + vol * 0.1);
                this.y += this.vy * (1 + vol * 0.1);
                this.radius += vol * 0.05;
                this.alpha -= this.decay;

                if (this.alpha <= 0) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                // 使用發光漸層，模仿傳統燈籠亮點
                let gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 2);
                gradient.addColorStop(0, `hsla(${this.hue}, 100%, 70%, 1)`);
                gradient.addColorStop(1, `hsla(${this.hue}, 100%, 40%, 0)`);
                ctx.fillStyle = gradient;
                ctx.arc(this.x, this.y, this.radius * 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 初始化粒子群
        function createParticles() {
            const particleCount = 80; // 粒子數量，適中即可，防舊手機卡頓
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        createParticles();

        // 點擊螢幕後啟動 Web Audio API
        async function initLantern() {
            if (isInitialized) return;
            
            try {
                // 隱藏提示覆蓋層
                document.getElementById('overlay').style.opacity = 0;
                setTimeout(() => document.getElementById('overlay').style.display = 'none', 500);

                // 1. 取得離線麥克風串流
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                // 2. 設定音訊分析器
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 64; // 顆粒度，燈籠律動不需要太高，64 運算最流暢
                
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                source.connect(analyser);

                // 3. 嘗試請求螢幕永不休眠 (Wake Lock API)
                if ('wakeLock' in navigator) {
                    try { await navigator.wakeLock.request('screen'); } catch (err) { console.log("Wake lock active error"); }
                }

                isInitialized = true;
                animate();
            } catch (err) {
                alert('無法取得麥克風，請檢查權限設定！網頁將以自動展示模式運行。');
                isInitialized = true;
                animate(); // 失敗依然允許執行自動動畫
            }
        }

        // 主動畫循環
        /*function animate() {

            }

            // 隨聲音動態改變基礎色調：平常是溫暖的紅橘色，聲音超大時會轉變為金黃色、螢光色
            baseHue = 15 + (volume * 0.3);

            // 清除畫布，但保留一點殘影效果（Motion Blur），讓光暈更柔和

            let centerGlow = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 10,
                canvas.width / 2, canvas.height / 2, (canvas.width * 0.4) + (volume * 1.5)
            );
            centerGlow.addColorStop(0, `hsla(${baseHue}, 100%, 60%, ${0.3 + (volume / 255)})`);

                 // 主動畫循環
        function animate() {
            requestAnimationFrame(animate);

            let volume = 0;
            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
                // 計算平均音量震幅
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) { sum += dataArray[i]; }
                volume = sum / dataArray.length; // 數值大約在 0 - 255 之間
            } else {
                // 若無音訊，模擬微弱的心跳呼吸起伏
                volume = (Math.sin(Date.now() * 0.003) + 1) * 15;
            }

            // 🌟 【自動變色核心邏輯】 🌟
            // 利用 Date.now() 取得時間戳記，乘以 0.02 可以控制變色的速度（數字越小變色越慢）
            // % 360 是因為 HSL 的色彩圓環總共是 0 到 359 度
            let timeHue = (Date.now() * 0.02) % 360;

            // 將「時間自動變色」與「聲音震幅」結合：
            // 平常會自動彩色循環，但當你大喊或拍手時（volume 變大），顏色會產生額外的瞬間偏轉，互動感更強！
            baseHue = timeHue + (volume * 0.4);

            // 清除畫布，但保留一點殘影效果（Motion Blur），讓光暈更柔和
            ctx.fillStyle = `rgba(5, 0, 0, ${0.12 + (volume * 0.0005)})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 在燈籠正中央繪製一個巨大的動態核心光暈
            let centerGlow = ctx.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 10,
                canvas.width / 2, canvas.height / 2, (canvas.width * 0.4) + (volume * 1.5)
            );
            centerGlow.addColorStop(0, `hsla(${baseHue}, 100%, 60%, ${0.3 + (volume / 255)})`);
            centerGlow.addColorStop(0.5, `hsla(${baseHue + 20}, 100%, 50%, 0.1)`);
            centerGlow.addColorStop(1, 'rgba(5,0,0,0)');
            ctx.fillStyle = centerGlow;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 更新並繪製所有微小粒子
            particles.forEach(p => {
                p.update(volume);
                p.draw();
            });
        }
        
    </script>
</body>
</html>
