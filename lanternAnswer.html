<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中秋 P牌燈謎大挑戰</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1b1b2f, #162447, #1f4068);
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        h1 {
            color: #f39c12;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .riddle-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
            font-size: 20px;
            margin: 20px 0;
            border-left: 5px solid #f39c12;
            line-height: 1.5;
        }
        input[type="text"] {
            width: 80%;
            padding: 12px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            outline: none;
            text-align: center;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        button {
            background-color: #f39c12;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
        }
        button:hover {
            background-color: #e67e22;
            transform: scale(1.05);
        }
        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            min-height: 30px;
        }
        .correct {
            color: #2ecc71;
            animation: bounce 0.5s;
        }
        .wrong {
            color: #e74c3c;
            animation: shake 0.5s;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
        @keyframes shake {
            0%, 100% {transform: translateX(0);}
            20%, 60% {transform: translateX(-10px);}
            40%, 80% {transform: translateX(10px);}
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌕 P牌車手慶功燈謎 🚗</h1>
        <p>請猜一個中秋活動：</p>
        
        <div class="riddle-box">
            「P牌仔八月十六入利園：<br>後面跟得太貼。」
        </div>

        <input type="text" id="answerInput" placeholder="輸入你的謎底..." autocomplete="off">
        <br>
        <button onclick="checkAnswer()">提交答案</button>

        <div id="result"></div>
    </div>

    <script>
        function checkAnswer() {
            const input = document.getElementById('answerInput').value.trim();
            const resultDiv = document.getElementById('result');

            // 允許常見的正確答案寫法
            const correctAnswers = ['追月', '追月日'];

            if (correctAnswers.includes(input)) {
                resultDiv.className = 'correct';
                resultDiv.innerHTML = '🎉 中啊！真係「追月」！祝P牌車手可以順利上路！🚗💨';
            } else if (input === '') {
                resultDiv.className = 'wrong';
                resultDiv.innerHTML = '⚠️ 咦？未入波（未填答案）喎！再望清楚個謎面試下～';
            } else {
                resultDiv.className = 'wrong';
                resultDiv.innerHTML = `❌ 爭少少（你輸入咗：「${input}」）！考牌官話呢個答案未到位，比多次機會你再嚟！`;
            }
        }

        // 支援按 Enter 鍵直接提交
        document.getElementById("answerInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkAnswer();
            }
        });
    </script>

</body>
</html>
